name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test data and experiment boundaries (no weights)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate example format
        env:
          PYTHONPATH: src
        run: python -m lev validate --data data/examples/format-only.jsonl
